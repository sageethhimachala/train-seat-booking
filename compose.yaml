services:
  database:
    image: postgres:17-alpine

    container_name: train-booking-database

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - train_booking_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: train-booking-backend

    restart: unless-stopped

    environment:
      DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

    depends_on:
      database:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT}:8000"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - train_booking_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1

    container_name: train-booking-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT}:80"

    networks:
      - train_booking_network

volumes:
  postgres_data:

networks:
  train_booking_network:
    driver: bridge
